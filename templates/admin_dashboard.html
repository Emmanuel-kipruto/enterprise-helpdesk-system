<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <span class="navbar-brand mb-0 h1">
                Admin Control Center
            </span>

            <a href="/logout"
               class="btn btn-danger">
               Logout
            </a>

        </div>

    </nav>


    <div class="container mt-4">

        <h2>All Tickets</h2>

        <div class="card shadow mt-3">

            <div class="card-body">

                <table class="table table-hover">

                    <thead class="table-dark">

                        <tr>
                            <th>Ticket Code</th>
                            <th>Title</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Technician</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody>

                        {% for ticket in tickets %}

                        <tr>

                            <td>{{ ticket.ticket_code }}</td>

                            <td>{{ ticket.title }}</td>

                            <td>{{ ticket.priority }}</td>

                            <td>{{ ticket.status }}</td>

                            <td>

                                <form
                                    action="/assign-technician/{{ ticket.id }}"
                                    method="POST"
                                    class="d-flex"
                                >

                                    <input
                                        type="text"
                                        name="technician"
                                        class="form-control me-2"
                                        placeholder="Technician"
                                        value="{{ ticket.technician or '' }}"
                                    >

                                    <button
                                        type="submit"
                                        class="btn btn-primary"
                                    >
                                        Assign
                                    </button>

                                </form>

                            </td>

                            <td>

                                <div class="d-flex gap-1">

                                    <a
                                        class="btn btn-danger btn-sm"
                                        href="/update-status/{{ ticket.id }}/Open"
                                    >
                                        Open
                                    </a>

                                    <a
                                        class="btn btn-warning btn-sm"
                                        href="/update-status/{{ ticket.id }}/In Progress"
                                    >
                                        Progress
                                    </a>

                                    <a
                                        class="btn btn-success btn-sm"
                                        href="/update-status/{{ ticket.id }}/Closed"
                                    >
                                        Close
                                    </a>

                                </div>

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</body>

</html>
